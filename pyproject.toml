[project]
name = "fastapi-startkit-application"
version = "0.1.0"
description = ""
authors = [
    { name = "Bedram Tamang", email = "tmgbedu@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "cleo>=2.1.0",
    "fastapi-startkit[database,fastapi,sqlite]",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "dumpdie>=1.5.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F401"]
fixable = ["F401"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
