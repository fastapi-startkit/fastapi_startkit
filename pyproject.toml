[project]
name = "fastapi-startkit"
version = "0.1.0"
description = ""
authors = [
    {name = "Bedram Tamang",email = "tmgbedu@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard] (>=0.124.4,<0.125.0)",
    "masonite-orm (>=3.0.0,<4.0.0)",
    "typer (>=0.20.0,<0.21.0)",
    "dependency-injector (>=4.48.3,<5.0.0)",
    "dotty-dict (>=1.3.1,<2.0.0)",
    "cryptography (>=46.0.3,<47.0.0)",
    "werkzeug (>=3.1.4,<4.0.0)",
    "tldextract (>=5.3.0,<6.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "whitenoise (>=6.11.0,<7.0.0)",
    "exceptionite (>=3.0.0,<4.0.0)",
    "hashids (>=1.3.1,<2.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "fastapi-startkit-foundation @ file:modules/foundation"
]

[project.optional-dependencies]
database = [
    "fastapi-startkit-database @ file:modules/database"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
